<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square Terminal — Customer Display</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f0f11;
    --panel: #18181b;
    --card: #27272a;
    --accent: #ffffff;
    --accent-text: #000000;
    --green: #10b981;
    --red: #E4142B;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --border: #27272a;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Connection screen */
  #connect-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .connect-box { background: var(--panel); border: 1px solid var(--border); padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; }
  input { width: 100%; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 18px; text-align: center; margin-bottom: 14px; outline: none; font-family: monospace; letter-spacing: 2px; }
  .connect-btn { width: 100%; padding: 14px; background: var(--accent); color: var(--accent-text); border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }

  /* Main Terminal UI (Hidden until connected) */
  #terminal-app { display: none; flex: 1; flex-direction: column; height: 100vh; position: relative; }

  /* 1. Idle/Attract Screen (When cart total is 0) */
  #idle-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; transition: opacity 0.3s ease; }
  .square-logo { width: 64px; height: 64px; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(255,255,255,0.1); }
  .square-inner { width: 28px; height: 28px; border: 4px solid #000; border-radius: 4px; }
  .idle-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .idle-sub { font-size: 15px; color: var(--text-muted); }

  /* 2. Itemized Bill View */
  .bill-container { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .bill-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; background: #000; display: flex; justify-content: space-between; align-items: center; }
  .bill-items { flex: 1; overflow-y: auto; padding: 20px; }
  .bill-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 15px; }
  .bill-footer { padding: 24px; border-top: 1px solid var(--border); background: var(--panel); }
  .calc-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
  .total-row { display: flex; justify-content: space-between; font-size: 26px; font-weight: 800; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 14px; }

  /* Tip & Approval Overlays */
  .overlay-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 30px; text-align: center; }
  .tip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 360px; margin-top: 20px; }
  .tip-btn { padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer; }
  .tip-btn:hover { border-color: var(--accent); }
  
  .status-icon { font-size: 64px; margin-bottom: 16px; }
</style>
</head>
<body>

  <div id="connect-screen">
    <div class="connect-box">
      <div style="font-weight:700; font-size:18px; margin-bottom:6px;">Square Customer Terminal</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">Enter the 4-digit code shown on the cashier screen</div>
      <input type="text" id="code-input" placeholder="0000" maxlength="4">
      <button class="connect-btn" onclick="connectToCashier()">Connect Terminal</button>
    </div>
  </div>

  <div id="terminal-app">
    
    <div id="idle-screen">
      <div class="square-logo">
        <div class="square-inner"></div>
      </div>
      <div class="idle-title">Radiant POS</div>
      <div class="idle-sub">Ready for next purchase...</div>
    </div>

    <div class="bill-container">
      <div class="bill-header">
        <span>Your Order</span>
        <span id="conn-indicator" style="font-size:12px; color:var(--green);">● Connected</span>
      </div>
      <div class="bill-items" id="bill-items">
        </div>
      <div class="bill-footer">
        <div class="calc-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="calc-row"><span>Tax (8.875%)</span><span id="tax">$0.00</span></div>
        <div class="total-row"><span>Total</span><span id="total">$0.00</span></div>
      </div>
    </div>

    <div class="overlay-screen" id="tip-screen">
      <h2 style="margin-bottom:6px;">Leave a Tip?</h2>
      <div style="color:var(--text-muted); font-size:14px; margin-bottom:10px;" id="tip-total-label">Total: $0.00</div>
      <div class="tip-grid">
        <button class="tip-btn" onclick="selectTip(0)">No Tip</button>
        <button class="tip-btn" onclick="selectTip(0.10)">10%</button>
        <button class="tip-btn" onclick="selectTip(0.15)">15%</button>
        <button class="tip-btn" onclick="selectTip(0.20)">20%</button>
      </div>
    </div>

    <div class="overlay-screen" id="result-screen">
      <div class="status-icon" id="result-icon">⏳</div>
      <h2 id="result-title">Processing Payment...</h2>
      <div style="color:var(--text-muted); font-size:14px; margin-top:8px;" id="result-sub">Please wait for authorization</div>
    </div>

  </div>

<script>
  let peer, conn;
  let currentTotal = 0;

  function connectToCashier() {
    const code = document.getElementById('code-input').value.trim();
    if (code.length !== 4) {
      alert('Please enter a valid 4-digit code.');
      return;
    }

    peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', () => {
      conn = peer.connect("sq-" + code);

      conn.on('open', () => {
        document.getElementById('connect-screen').style.display = 'none';
        document.getElementById('terminal-app').style.display = 'flex';
      });

      conn.on('data', data => {
        handleCashierData(data);
      });

      conn.on('error', err => {
        alert('Connection error. Check code and try again.');
      });
    });
  }

  function handleCashierData(data) {
    const idleScreen = document.getElementById('idle-screen');
    const tipScreen = document.getElementById('tip-screen');
    const resultScreen = document.getElementById('result-screen');

    if (data.type === 'SYNC_CART') {
      currentTotal = data.total;
      
      // Update itemized list
      const listEl = document.getElementById('bill-items');
      if (!data.cart || data.cart.length === 0) {
        listEl.innerHTML = `<div style="color:var(--text-muted); text-align:center; margin-top:60px;">Your items will appear here as the cashier scans them.</div>`;
        idleScreen.style.opacity = '1';
        idleScreen.style.pointerEvents = 'auto';
      } else {
        idleScreen.style.opacity = '0';
        idleScreen.style.pointerEvents = 'none';
        
        listEl.innerHTML = data.cart.map(item => `
          <div class="bill-row">
            <div>
              <div style="font-weight:600;">${item.name}</div>
              <div style="font-size:11px; color:var(--text-muted);">${item.spec || ''}</div>
            </div>
            <div style="font-weight:600;">$${item.price}</div>
          </div>
        `).join('');
      }

      document.getElementById('subtotal').innerText = `$${data.subtotal.toFixed(2)}`;
      document.getElementById('tax').innerText = `$${data.tax.toFixed(2)}`;
      document.getElementById('total').innerText = `$${data.total.toFixed(2)}`;
    } 
    else if (data.type === 'START_TIP_SCREEN') {
      document.getElementById('tip-total-label').innerText = `Total: $${data.total.toFixed(2)}`;
      tipScreen.style.display = 'flex';
    } 
    else if (data.type === 'FORCE_APPROVE') {
      tipScreen.style.display = 'none';
      resultScreen.style.display = 'flex';
      document.getElementById('result-icon').innerText = '✅';
      document.getElementById('result-title').innerText = 'Payment Approved';
      document.getElementById('result-sub').innerText = 'Thank you for your purchase!';
      
      setTimeout(() => {
        resultScreen.style.display = 'none';
      }, 3500);
    } 
    else if (data.type === 'FORCE_DECLINE') {
      tipScreen.style.display = 'none';
      resultScreen.style.display = 'flex';
      document.getElementById('result-icon').innerText = '❌';
      document.getElementById('result-title').innerText = 'Payment Declined';
      document.getElementById('result-sub').innerText = 'Please try another payment method.';
      
      setTimeout(() => {
        resultScreen.style.display = 'none';
      }, 3500);
    }
  }

  function selectTip(percent) {
    const finalAmount = currentTotal * (1 + percent);
    document.getElementById('tip-screen').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'flex';
    document.getElementById('result-icon').innerText = '💳';
    document.getElementById('result-title').innerText = 'Insert or Tap Card...';
    document.getElementById('result-sub').innerText = `Amount to pay: $${finalAmount.toFixed(2)}`;
  }
</script>
</body>
</html>
