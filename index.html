<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Square Terminal — Customer Display</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f0f11;
    --panel: #18181b;
    --card: #27272a;
    --accent: #ffffff;
    --accent-text: #000000;
    --green: #10b981;
    --red: #E4142B;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --border: #27272a;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Connection screen */
  #connect-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  .connect-box { background: var(--panel); border: 1px solid var(--border); padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; }
  input { width: 100%; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 18px; text-align: center; margin-bottom: 14px; outline: none; font-family: monospace; letter-spacing: 2px; }
  .connect-btn { width: 100%; padding: 14px; background: var(--accent); color: var(--accent-text); border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }

  /* Main Terminal UI (Hidden until connected) */
  #terminal-app { display: none; flex: 1; flex-direction: column; height: 100vh; position: relative; }

  /* 1. Idle/Attract Screen (When cart total is 0) */
  #idle-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; transition: opacity 0.3s ease; }
  .square-logo { width: 64px; height: 64px; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(255,255,255,0.1); }
  .square-inner { width: 28px; height: 28px; border: 4px solid #000; border-radius: 4px; }
  .idle-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .idle-sub { font-size: 15px; color: var(--text-muted); }

  /* 2. Itemized Bill View */
  .bill-container { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
  .bill-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; background: #000; display: flex; justify-content: space-between; align-items: center; }
  .bill-items { flex: 1; overflow-y: auto; padding: 20px; }
  .bill-row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 15px; }
  .bill-footer { padding: 24px; border-top: 1px solid var(--border); background: var(--panel); }
  .calc-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
  .total-row { display: flex; justify-content: space-between; font-size: 26px; font-weight: 800; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 14px; }

  /* Tip & Approval Overlays */
  .overlay-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 30px; text-align: center; }
  .tip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 360px; margin-top: 20px; }
  .tip-btn { padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer; }
  .tip-btn:hover { border-color: var(--accent); }
  
  .status-icon { font-size: 64px; margin-bottom: 16px; }
</style>
</head>
