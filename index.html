<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Square Customer Terminal</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --square-blue: #006aff;
    --bg-dark: #000000;
    --green: #10b981;
    --red: #ef4444;
    --text-muted: #8e8e93;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    color: white;
    overflow: hidden;
  }

  .terminal-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #000000;
  }

  .setup-screen { 
    padding: 40px; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    height: 100%; 
    max-width: 480px;
    margin: 0 auto;
  }
  .code-input { 
    width: 100%; 
    padding: 20px; 
    font-size: 32px; 
    text-align: center; 
    border-radius: 16px; 
    border: 1px solid #333; 
    background: #111; 
    color: #fff; 
    letter-spacing: 8px; 
    margin: 28px 0; 
    font-family: monospace; 
    outline: none;
  }
  .code-input:focus { border-color: var(--square-blue); }

  .connect-btn { 
    width: 100%; 
    padding: 20px; 
    background: #ffffff; 
    color: #000000; 
    font-weight: 700; 
    border: none; 
    border-radius: 16px; 
    font-size: 18px; 
    cursor: pointer; 
  }
  .connect-btn:active { background: #d4d4d4; }

  .tap-zone-header {
    height: 90px;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    z-index: 10;
    flex-shrink: 0;
  }
  .nfc-icon {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    display: none;
  }
  .tap-zone-header.active .nfc-icon {
    display: block;
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .viewport { flex: 1; display: flex; flex-direction: column; position: relative; }

  .display-screen { 
    flex: 1; 
    background: #000000; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    padding: 40px; 
    text-align: center; 
  }
  .term-header { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .center-total-box { margin: auto 0; }
  .total-label { font-size: 18px; font-weight: 500; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .total-price { font-size: 80px; font-weight: 800; color: #ffffff; letter-spacing: -2px; line-height: 1; }

  .pay-screen { 
    flex: 1; 
    background: var(--square-blue); 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    padding: 50px 40px; 
    text-align: center; 
    user-select: none;
  }
  .pay-total-label { font-size: 18px; font-weight: 600; color: rgba(255, 255, 255, 0.75); text-transform: uppercase; letter-spacing: 1px; }
  .pay-total-amount { font-size: 76px; font-weight: 800; color: #ffffff; letter-spacing: -1.5px; margin-top: 6px; }
  .pay-instructions { font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 30px; line-height: 1.3; }

  .approved-screen { background: var(--green); flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .declined-screen { background: var(--red); flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  
  .status-title { font-size: 42px; font-weight: 800; margin: 16px 0 6px 0; }
  .status-sub { font-size: 20px; opacity: 0.9; }
</style>
</head>
<body>

  <div class="terminal-container">
    <div class="setup-screen" id="setup-screen">
      <h2 style="margin: 0; font-size: 26px; font-weight: 700;">Pair Customer Terminal</h2>
      <p style="color: var(--text-muted); font-size: 15px; margin-top: 10px;">Enter the 4-digit register code shown on the cashier screen:</p>
      <input type="text" class="code-input" id="pair-code" placeholder="0000" maxlength="4">
      <button class="connect-btn" id="connect-btn">Connect Terminal</button>
    </div>

    <div class="tap-zone-header" id="tap-bar" style="display:none;">
      <svg class="nfc-icon" viewBox="0 0 24 24">
        <path d="M6 14a6 6 0 0 1 0-8.49"/>
        <path d="M8.83 12.17a2 2 0 0 1 0-2.83"/>
        <path d="M15.17 9.34a2 2 0 0 1 0 2.83"/>
        <path d="M18 5.51a6 6 0 0 1 0 8.49"/>
      </svg>
    </div>

    <div class="viewport" id="viewport-container" style="display:none;">

      <div class="display-screen" id="display-screen">
        <div class="term-header">Square Terminal</div>
        <div class="center-total-box">
          <div class="total-label">Total</div>
          <div class="total-price" id="total-val">$0.00</div>
        </div>
        <div style="height: 24px;"></div>
      </div>

      <div class="pay-screen" id="pay-screen" style="display:none;">
        <div>
          <div class="pay-total-label">Pay Amount</div>
          <div class="pay-total-amount" id="pay-amount">$0.00</div>
        </div>
        <div class="pay-instructions">Insert, Tap,<br>or Swipe</div>
      </div>

      <div class="approved-screen" id="approved-screen" style="display:none;">
        <div style="font-size: 96px;">✅</div>
        <div class="status-title">Approved</div>
        <div class="status-sub">Thank you</div>
      </div>

      <div class="declined-screen" id="declined-screen" style="display:none;">
        <div style="font-size: 96px;">❌</div>
        <div class="status-title">Declined</div>
        <div class="status-sub">Please try another card</div>
      </div>

    </div>
  </div>

<script>
  let peer, conn, pingInterval;

  // Safe DOM Event listener binding so it never misses a click
  document.addEventListener('DOMContentLoaded', () => {
    const connectBtn = document.getElementById('connect-btn');
    if (connectBtn) {
      connectBtn.addEventListener('click', pairWithCashier);
    }
    
    // Also allow pressing "Enter" on the keyboard input field
    const codeInput = document.getElementById('pair-code');
    if (codeInput) {
      codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pairWithCashier();
      });
    }
  });

  function pairWithCashier() {
    const codeInput = document.getElementById('pair-code');
    const btn = document.getElementById('connect-btn');
    
    if (!codeInput || !btn) return;

    const code = codeInput.value.trim();
    if (code.length !== 4) {
      alert('Please enter a valid 4-digit code.');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Connecting...';

    if (peer) {
      try { peer.destroy(); } catch(e) {}
    }

    peer = new Peer({
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', () => {
      conn = peer.connect('sq-' + code, { reliable: true });

      conn.on('open', () => {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('tap-bar').style.display = 'flex';
        document.getElementById('viewport-container').style.display = 'flex';
        document.getElementById('display-screen').style.display = 'flex';

        clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (conn && conn.open) conn.send({ type: 'PING' });
        }, 5000);
      });

      conn.on('data', data => {
        if (data.type === 'SYNC_CART') {
          renderTotalOnly(data.total);
        }
        else if (data.type === 'START_PAYMENT') {
          showSquareBluePayment(data.total);
        }
        else if (data.type === 'FORCE_APPROVE') {
          showApproved();
        }
        else if (data.type === 'FORCE_DECLINE') {
          showDeclined();
        }
      });

      conn.on('close', handleDisconnect);
      conn.on('error', handleDisconnect);
    });

    peer.on('error', err => {
      console.error(err);
      alert('Could not connect. Ensure the Cashier screen is open and your code (' + code + ') is correct.');
      btn.disabled = false;
      btn.innerText = 'Connect Terminal';
    });
  }

  function handleDisconnect() {
    clearInterval(pingInterval);
    document.getElementById('setup-screen').style.display = 'flex';
    document.getElementById('tap-bar').style.display = 'none';
    document.getElementById('viewport-container').style.display = 'none';
    
    const btn = document.getElementById('connect-btn');
    if (btn) {
      btn.disabled = false;
      btn.innerText = 'Connect Terminal';
    }
  }

  function renderTotalOnly(total) {
    hideAllScreens();
    document.getElementById('display-screen').style.display = 'flex';
    document.getElementById('tap-bar').classList.remove('active');
    document.getElementById('total-val').innerText = `$${(total || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
  }

  function showSquareBluePayment(total) {
    hideAllScreens();
    document.getElementById('pay-screen').style.display = 'flex';
    document.getElementById('tap-bar').classList.add('active');
    document.getElementById('pay-amount').innerText = `$${(total || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
  }

  function showApproved() {
    hideAllScreens();
    document.getElementById('approved-screen').style.display = 'flex';
    document.getElementById('tap-bar').classList.remove('active');

    setTimeout(() => {
      hideAllScreens();
      document.getElementById('display-screen').style.display = 'flex';
      document.getElementById('total-val').innerText = '$0.00';
    }, 2200);
  }

  function showDeclined() {
    hideAllScreens();
    document.getElementById('declined-screen').style.display = 'flex';
    document.getElementById('tap-bar').classList.remove('active');

    setTimeout(() => {
      hideAllScreens();
      document.getElementById('display-screen').style.display = 'flex';
    }, 2500);
  }

  function hideAllScreens() {
    ['display-screen', 'pay-screen', 'approved-screen', 'declined-screen'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }
</script>
</body>
</html>
